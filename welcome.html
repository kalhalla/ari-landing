<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ari – Welcome</title>
  <meta name="description" content="Welcome to Ari.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFF8F3">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script defer src="/_vercel/insights/script.js"></script>
  <script src="/ari-paywall.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --peach-light: #FFF8F3; --peach-mid: #FFE8D6; --orange: #FF8C42; --orange-dark: #E8622C; --brown-dark: #5D4037; --brown-mid: #8D6E63; --ink: #4A3229; --mono: 'IBM Plex Mono', ui-monospace, monospace; }
    body { font-family: 'Nunito', sans-serif; background: var(--peach-light); color: var(--brown-dark); -webkit-tap-highlight-color: transparent; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 40px; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; }
    .logo { font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--brown-dark); text-decoration: none; }
    .logo-icon { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--orange), var(--orange-dark)); display: grid; place-items: center; font-size: 18px; }
    .nav-link { font-weight: 800; font-size: 14px; color: var(--brown-dark); text-decoration: none; border: 2px solid var(--brown-dark); border-radius: 20px; padding: 7px 14px; }
    .eyebrow { font-family: var(--mono); font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--orange-dark); }
    h1 { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(30px, 7.4vw, 48px); line-height: 1.06; margin: 8px 0 12px; color: var(--ink); }
    h1 em { font-style: normal; color: var(--orange-dark); }
    h2 { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: var(--ink); margin: 34px 0 8px; }
    p { font-size: 17px; line-height: 1.55; color: var(--brown-mid); margin-bottom: 12px; }
    p b { color: var(--ink); }
    .opts { display: grid; gap: 12px; margin: 18px 0 8px; }
    @media (min-width: 620px) { .opts { grid-template-columns: 1fr 1fr; } }
    .opt { display: block; text-decoration: none; border-radius: 18px; padding: 16px 18px; border: 2px solid var(--ink); color: var(--ink); background: #fff; }
    .opt.main { background: var(--orange); border-color: var(--orange-dark); color: #fff; box-shadow: 0 4px 0 var(--orange-dark); }
    .opt strong { display: block; font-family: 'Fredoka', sans-serif; font-size: 21px; font-weight: 700; }
    .opt span { display: block; font-size: 14.5px; margin-top: 3px; opacity: .93; }
    .fine { font-size: 14px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; background: #fff; border-radius: 16px; overflow: hidden; }
    th, td { text-align: left; padding: 11px 12px; font-size: 15.5px; line-height: 1.35; vertical-align: top; border-bottom: 1px solid var(--peach-mid); }
    th { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--brown-mid); background: var(--peach-mid); }
    tr:last-child td { border-bottom: none; }
    td a { color: var(--ink); font-weight: 800; }
    td small { display: block; font-family: var(--mono); font-size: 12px; color: var(--orange-dark); margin-top: 2px; }
    .big { display: inline-block; margin-top: 6px; background: var(--orange); color: #fff; font-weight: 800; font-size: 17px; text-decoration: none; border-radius: 999px; padding: 13px 22px; box-shadow: 0 4px 0 var(--orange-dark); }
    footer { margin-top: 40px; display: flex; justify-content: space-between; font-size: 14px; color: var(--brown-mid); }
    footer a { color: var(--brown-mid); margin-right: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="logo" href="/"><div class="logo-icon">🦉</div>Ari</a>
      <a class="nav-link" href="/machines.html">Every machine</a>
    </nav>
    <header>
      <div class="eyebrow">Welcome</div>
      <h1 id="wTitle">Checking your link…</h1>
      <p id="wText"></p>
      <a class="big" id="wBtn" href="/machines.html" style="display:none">Open the workshop</a>
    </header>
    <script>
      (function () {
        var P = window.AriPaywall;
        var key = new URLSearchParams(location.search).get('key');
        var ok = P && (P.unlock(key) || P.isMember());
        var t = document.getElementById('wTitle'), x = document.getElementById('wText'), b = document.getElementById('wBtn');
        if (ok) {
          t.innerHTML = 'You are in. <em>Every machine is open.</em>';
          x.innerHTML = 'Thank you for backing Ari this early. <b>Keep this page link.</b> Open it on any other phone, tablet or computer your child uses and it will unlock that one too.';
          b.style.display = 'inline-block';
        } else {
          t.textContent = 'That link did not work';
          x.innerHTML = 'If you have paid and landed here, we will sort it out straight away. <a href="/contact.html">Get in touch</a>.';
        }
      })();
    </script>

    <footer>
      <div><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/contact.html">Contact</a></div>
      <div>© 2026 Ari</div>
    </footer>
  </div>
</body>
</html>
